<script>
const $=i=>document.getElementById(i),RR=(a,b)=>a+Math.random()*(b-a),ri=(a,b)=>Math.floor(RR(a,b+1)),cl=v=>Math.max(0,Math.min(100,v));

const T={school:[26,18,8,0xd98f5c,"🏫 School"],company:[16,16,30,0x5b8fb9,"🏢 Company"],hospital:[24,16,12,0xeeeeee,"🏥 Hospital"],fuel:[18,10,4,0xe0b030,"⛽ Fuel Pump"],shop:[20,14,7,0xb5805a,"🛒 Mall"],bank:[18,14,10,0x8a8f99,"🏦 Bank"],house:[14,12,5,0xb89f86,"🏠 House"],home:[14,12,5,0x7a6a58,"🏚️ Your Home"]};

let SC,CAM,R,sun,P=null,pm=null,bl=[],cars=[],npcs=[],st="menu",cam={yaw:0,pitch:.38,d:10},joy={x:0,y:0},keys={},run=false,evT=30,ev=null,hudT=0,saveT=0,tt=0,last=0,jid=null,dg=null;
function M(g,c,x,y,z,par){const o=new THREE.Mesh(g,lam(c));o.position.set(x,y,z);o.castShadow=o.receiveShadow=true;(par||SC).add(o);return o}
function lbl(t,w,h,fs,bg){const c=document.createElement("canvas");c.width=w;c.height=h;const x=c.getContext("2d");if(bg){x.fillStyle=bg;x.fillRect(0,0,w,h)}x.font="bold "+fs+"px Trebuchet MS";x.textAlign="center";x.textBaseline="middle";if(!bg){x.lineWidth=7;x.strokeStyle="#000";x.strokeText(t,w/2,h/2)}x.fillStyle="#fff";x.fillText(t,w/2,h/2);return new THREE.CanvasTexture(c)}

M(BX(.2,.45,.22),tp,0,-.2,0,la);M(BX(.2,.45,.22),tp,0,-.2,0,ra);M(BX(.18,.3,.2),0xe0ac80,0,-.58,0,la);M(BX(.18,.3,.2),0xe0ac80,0,-.58,0,ra);
M(BX(.72,.85,.4),tp,0,1.25,0,g);M(new THREE.SphereGeometry(.28,14,10),0xe0ac80,0,1.95,0,g);

g.userData={ll,rl,la,ra};SC.add(g);return g}

const hue=s=>{let h=7;for(const c of s)h=(h*31+c.charCodeAt(0))%997;return h*13%360},HR=[0x2a1a10,0x4a3020,0x1a1a1a,0x7a5a2a];

M(BX(w,h,d),col,cx,h/2,cz);M(BX(w+.8,.6,d+.8),c.clone().multiplyScalar(.55),cx,h+.3,cz);M(BX(2.6,3,.3),0x3a2a1c,cx,1.5,cz+d/2+.1);
for(let y=4;y<h-1;y+=3.5)M(BX(w*.85,1.5,.15),0xbfe3f2,cx,y,cz+d/2+.08);
if(t==="fuel"){M(BX(18,.4,8),0xcc3333,cx,6,cz+d/2+5);M(BX(.5,6,.5),0x888888,cx-8,3,cz+d/2+8);M(BX(.5,6,.5),0x888888,cx+8,3,cz+d/2+8)}
sign(lb,512,96,56,"rgba(0,0,0,.6)",7,1.3,cx,h+3,cz+d/2);bl.push({x:cx,z:cz,w:w+1,d:d+1,t,lb,dz:cz+d/2+3})}
function car(axis,line,dir,col){const g=new THREE.Group();M(BX(4,1.1,1.9),col,0,.9,0,g);M(BX(2.2,.9,1.7),0xcfe8f5,-.2,1.8,0,g);[[-1.3,-.9],[1.3,-.9],[-1.3,.9],[1.3,.9]].forEach(p=>M(BX(.8,.8,.3),0x111111,p[0],.4,p[1],g));
SC.add(g);cars.push({g,axis,line,dir,p:RR(-120,120),v:RR(10,16)})}
function npc(role,name,bx,bz,r){const o=person(hue(name),HR[ri(0,3)],role==="cit"?null:name);npcs.push({o,role,name,x:bx+RR(-r,r),z:bz+RR(-r,r),vx:0,vz:0,t:0,bx,bz,r,a:0,sc:role==="Mom"||role==="Dad"||role==="cit"?1:.7})}
function build(){SC=new THREE.Scene();SC.background=new THREE.Color(0x8fc8ee);SC.fog=new THREE.Fog(0x8fc8ee,60,190);
CAM=new THREE.PerspectiveCamera(60,innerWidth/innerHeight,.3,300);
R=new THREE.WebGLRenderer({canvas:$("cv"),antialias:true});R.setPixelRatio(Math.min(devicePixelRatio||1,2));R.shadowMap.enabled=true;R.shadowMap.type=THREE.PCFSoftShadowMap;R.setSize(innerWidth,innerHeight,false);
SC.add(new THREE.HemisphereLight(0xdff0ff,0x667755,.85));sun=new THREE.DirectionalLight(0xfff0cc,.95);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);const s=sun.shadow.camera;s.left=s.bottom=-45;s.right=s.top=45;s.far=200;SC.add(sun,sun.target);
const pl=(w,d,c,x,z,y)=>{const o=M(new THREE.PlaneGeometry(w,d),c,x,y,z);o.rotation.x=-Math.PI/2;o.castShadow=false;return o};
pl(500,500,0x6fae5c,0,0,0);[-60,0,60].forEach(v=>{pl(250,10,0x45454d,0,v,.02);pl(10,250,0x45454d,v,0,.03);pl(250,.3,0xe8e8d0,0,v,.04);pl(.3,250,0xe8e8d0,v,0,.05)});
MAP.forEach((row,j)=>row.forEach((t,i)=>{const cx=[-90,-30,30,90][i],cz=[-90,-30,30,90][j];pl(48,48,t==="park"?0x4f9a4a:0xa9a89a,cx,cz,.06);
if(t!=="park")addB(t,cx,cz);[[-20,-20],[20,-20],[-20,20],[20,20]].forEach(o=>{M(new THREE.CylinderGeometry(.25,.35,1.6,8),0x6b4a2a,cx+o[0],.8,cz+o[1]);M(new THREE.IcosahedronGeometry(1.5,1),0x3f8a3a,cx+o[0],2.7,cz+o[1])});
if(t!=="park"&&t!=="home")for(let k=0;k<2;k++)npc("cit",FN[ri(0,9)],cx,cz,18)}));
[-60,0,60].forEach((v,i)=>{car("x",v,1,[0xd62828,0x2a9d8f,0xf4a261][i]);car("x",v,-1,[0x264653,0xe9c46a,0xffffff][i]);car("z",v,1,[0x6a4c93,0x1982c4,0x8ac926][i])});
npc("Mom","Mom",-30,43,6);npc("Dad","Dad",-30,43,6);npc("Sib","Sibling",-30,43,6);
const h=bl.find(b=>b.t==="home");pm=person(200,0x2a1a10,null)}
function rs(){if(R){R.setSize(innerWidth,innerHeight,false);CAM.aspect=innerWidth/innerHeight;CAM.updateProjectionMatrix()}}

function save(){try{localStorage.setItem(SV,JSON.stringify(P))}catch(e){}}
function stage(){const a=P.age;return a<2?"Baby":a<3?"Toddler":a<13?"Child":a<18?"Teen":P.biz?"Businessman":"Adult"}
function newLife(){if(!R)build();P={name:$("name").value||"Bikneo",age:0,yt:0,x:-30,z:44,a:0,hp:100,hap:70,smart:20,money:0,rep:50,hunger:80,att:0,biz:0,lvl:0,cd:0,dead:0,tm:0};
npcs=npcs.filter(n=>{if(n.role==="Friend"){n.o.parent.remove(n.o);return false}return true});
play();log("You were born in a poor family. Mom looks after you.")}

function pause(){st="menu";$("menu").style.display="flex";$("hud").style.display="none";$("bCont").style.display=P&&!P.dead?"":"none";$("bCont").textContent="⏩ RESUME"}
function how(){alert("Move: joystick (left). Look: swipe the screen. Button (right) = action near buildings and people.\n\nAge 0-1 stay at home, Mom feeds you (tap Cry for Mom). Age 2 you can crawl out. Age 3+ you can walk and go to school until 18. Make smart choices, avoid cars, earn money, start a company and become a businessman!")}
function die(c){P.dead=1;st="menu";try{localStorage.removeItem(SV)}catch(e){}$("hud").style.display="none";$("dc").textContent=c;$("ds").textContent="Age "+P.age+" · "+stage()+" · $"+Math.round(P.money);$("dead").style.display="flex"}
function yearEnd(){P.age++;let m="Happy birthday! Age "+P.age+".";
if(P.age===2)m+=" You can crawl out of the house now.";
if(P.age===3){m+=" You can walk now! School starts.";["Friend","Friend","Friend"].forEach(()=>npc("Friend",FN[ri(0,9)],-30,43,25))}
if(P.age>=3&&P.age<18){if(P.att>=2){P.smart=cl(P.smart+4)}else{P.smart=cl(P.smart-8);P.rep=cl(P.rep-8);m+=" You skipped too much school!"}P.att=0}
if(P.age===18)m+=" You graduated! You can start a business.";
if(P.age>=75&&Math.random()<(P.age-74)/25)return die("Died of old age");

function ctx(){const b=bl.find(b=>Math.hypot(P.x-b.x,P.z-b.dz)<7);const A=P.age;

if(b){const t=b.t;
if(t==="home")return{l:"🍲 Rest & eat",f:()=>cd(15,()=>{P.hp=cl(P.hp+25);P.hap=cl(P.hap+5)},"Mom made you food.")};
if(t==="school")return A<18?{l:"📚 Attend class",f:()=>cd(5,()=>{P.smart=cl(P.smart+6);P.att++;P.hap=cl(P.hap-2)},"You learned something new.")}:{l:"School is over",f:()=>{}};
if(t==="hospital")return{l:"🏥 Treatment $200",f:()=>{if(P.money<200)return log("Not enough money.");P.money-=200;P.hp=cl(P.hp+50);log("You feel much better.")}};
if(t==="fuel")return A>=14?{l:"⛽ Work shift +$150",f:()=>cd(8,()=>{P.money+=150;P.hap=cl(P.hap-3);P.hp=cl(P.hp-2)},"+$150")}:{l:"Too young to work",f:()=>{}};
if(t==="company"){if(A<18)return{l:"Adults only",f:()=>{}};if(!P.biz)return P.money>=3000?{l:"🚀 Start business $3000",f:()=>{P.money-=3000;P.biz=1;P.lvl=1;log("You started your own company! You are a Businessman now.")}}:{l:"💼 Work as clerk +$250",f:()=>cd(8,()=>{P.money+=250;P.hap=cl(P.hap-2)},"+$250 (save $3000 to start a business)")};
return{l:"📈 Run business +$"+400*P.lvl,f:()=>cd(8,()=>{P.money+=400*P.lvl},"Your company earned profit.")}}
if(t==="bank")return P.biz&&P.money>=2000?{l:"🏦 Invest $2000",f:()=>{P.money-=2000;P.lvl++;log("Business level "+P.lvl+"! More income.")}}:{l:P.biz?"Need $2000 to invest":"Open for businessmen",f:()=>{}};
if(t==="shop")return{l:"🛒 Buy snacks $20",f:()=>{if(P.money<20)return log("No money.");P.money-=20;P.hap=cl(P.hap+8);P.hunger=cl(P.hunger+10)}};

const n=npcs.find(n=>n.role!=="cit"&&Math.hypot(P.x-n.x,P.z-n.z)<4);if(n)return{l:"💬 Talk to "+n.name,f:()=>cd(4,()=>{P.hap=cl(P.hap+4);if(n.role==="Friend")P.rep=cl(P.rep+3)},n.name+": hello!")};
return null}
function cd(s,f,msg){if(P.cd>tt)return;P.cd=tt+s;f();if(msg)log(msg)}

const EV=[
{ok:a=>a>=6&&a<18,q:"Friends ask you to skip school.",o:[["Skip with them",()=>{P.hap=cl(P.hap+10);P.smart=cl(P.smart-8);P.rep=cl(P.rep-6);log("Fun, but you fell behind.")}],["Go to class",()=>{P.smart=cl(P.smart+5);P.rep=cl(P.rep+3)}]]},
{ok:a=>a>=8&&a<18,q:"Older kids dare you to run across the highway.",o:[["Do it",()=>{if(Math.random()<.5)die("Hit by a car crossing the road");else{P.hap=cl(P.hap+8);log("You were lucky!")}}],["Refuse",()=>{P.rep=cl(P.rep+5)}]]},
{ok:a=>a>=12,q:"A gang invites you to join them.",o:[["Join",()=>{P.money+=300;P.rep=cl(P.rep-20);P.hp=cl(P.hp-25);log("Easy money, but you got hurt.")}],["Say no",()=>{P.rep=cl(P.rep+6)}]]},
{ok:a=>a>=10,q:"A stranger offers you easy money for a 'small job'.",o:[["Accept",()=>{if(Math.random()<.6){P.hp=cl(P.hp-40);P.money=Math.max(0,P.money-200);log("It was a trap!")}else P.money+=500}],["Refuse",()=>{}]]},
{ok:a=>a>=18,q:"A partner offers a $2000 investment deal.",o:[["Invest $2000",()=>{if(P.money<2000)return log("Not enough money.");P.money-=2000;if(Math.random()<.55){P.money+=5000;log("Big profit! +$3000")}else log("The deal failed. -$2000")}],["Pass",()=>{}]]},
{ok:a=>a>=18,q:"An official asks for a bribe to approve your permit.",o:[["Pay $500",()=>{P.money=Math.max(0,P.money-500);P.rep=cl(P.rep-10);P.lvl+=P.biz?1:0}],["Refuse",()=>{P.rep=cl(P.rep+8)}]]}];
