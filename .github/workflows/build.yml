name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: |
          npm init -y
          npm i @capacitor/core @capacitor/cli @capacitor/android
          npx cap init Bikneo com.bikneo.game --web-dir www
          npx cap add android
          cp MainActivity.java android/app/src/main/java/com/bikneo/game/MainActivity.java
          sed -i 's/<activity/<activity android:screenOrientation="sensorLandscape"/' android/app/src/main/AndroidManifest.xml
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: bikneo-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
